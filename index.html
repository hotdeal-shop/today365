<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>핫딜 실시간 특가몰</title>
    <style>
        /* 기본 스타일 및 초기화 */
        body { font-family: 'Apple SD Gothic Neo', -apple-system, sans-serif; background-color: #f5f5f7; margin: 0; padding: 0; color: #333; }
        .container { max-width: 500px; margin: 0 auto; background: #ffffff; min-height: 100vh; padding-bottom: 50px; box-shadow: 0 0 15px rgba(0,0,0,0.05); }
        
        /* 상단 퀵 링크 버튼 */
        .quick-links { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; background: #f9fafb; border-bottom: 1px solid #eee; }
        .btn-quick { padding: 12px; text-align: center; border-radius: 8px; font-size: 13px; font-weight: 700; text-decoration: none; color: #111; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .btn-gold { background: #ffdb4d; }
        .btn-fresh { background: #d4f0d4; color: #00701a; }
        
        /* 타임딜 타이머 바 */
        .timer-bar { background: #3b82f6; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 15px; }
        .timer-btn { background: white; color: #3b82f6; padding: 5px 12px; border-radius: 20px; font-size: 12px; text-decoration: none; }
        
        /* 검색창 */
        .search-container { padding: 15px; background: white; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #eee; }
        .search-box { width: 100%; padding: 12px 15px; border: 1.5px solid #ff3b30; border-radius: 8px; font-size: 14px; box-sizing: border-box; outline: none; transition: border-color 0.2s; }
        .search-box:focus { border-color: #d62828; }

        /* 카테고리 탭 */
        .tabs { display: flex; gap: 8px; padding: 0 15px 15px 15px; overflow-x: auto; background: white; border-bottom: 1px solid #f0f0f0; }
        .tabs::-webkit-scrollbar { display: none; }
        .tab-btn { padding: 8px 16px; border: 1px solid #ddd; border-radius: 20px; font-size: 13px; background: white; cursor: pointer; white-space: nowrap; font-weight: 500; }
        .tab-btn.active { background: #111; color: white; border-color: #111; }

        /* 상품 그리드 */
        .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 15px; }
        .card { background: white; border: 1px solid #eee; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; position: relative; text-decoration: none; color: inherit; }
        
        /* 이미지 영역 */
        .img-box { width: 100%; aspect-ratio: 1; background: #f9f9f9; position: relative; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }
        
        /* 배지 (최저가, 품절) */
        .badge-container { position: absolute; bottom: 8px; left: 8px; display: flex; gap: 5px; }
        .badge { padding: 4px 8px; font-size: 11px; font-weight: bold; color: white; border-radius: 4px; }
        .badge-low { background: #111; }
        .badge-soldout { background: rgba(0,0,0,0.6); }
        
        /* 정보 영역 */
        .info { padding: 12px; }
        .platform-tag { display: inline-block; font-size: 10px; padding: 2px 6px; background: #f0f0f0; color: #666; border-radius: 4px; margin-bottom: 6px; }
        .p-name { font-size: 13px; font-weight: 600; line-height: 1.4; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 36px; }
        .price-row { display: flex; align-items: baseline; gap: 5px; margin-bottom: 10px; }
        .p-discount { color: #ff3b30; font-weight: bold; font-size: 14px; }
        .p-price { font-weight: 800; font-size: 15px; }
        .btn-buy { background: #f3f4f6; color: #111; text-align: center; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: bold; display: block; border: none; width: 100%; cursor: pointer; }
        .btn-buy:active { background: #e5e7eb; }
        
        /* 품절 시 카드 스타일 처리 */
        .card.sold-out .img-box img { opacity: 0.4; }
        .card.sold-out .btn-buy { background: #ddd; color: #888; cursor: not-allowed; }
        
        #empty-msg { text-align: center; padding: 40px 20px; color: #888; font-size: 14px; grid-column: 1 / -1; display: none; }
    </style>
</head>
<body>

<div class="container">
    
    <!-- 1. 퀵 링크 버튼 (본인 제휴 링크로 변경) -->
    <div class="quick-links">
        <a href="https://coupang.com" class="btn-quick btn-gold" target="_blank">🎁 골드박스 특가</a>
        <a href="https://coupang.com" class="btn-quick btn-fresh" target="_blank">🥬 오늘의 식재료</a>
    </div>

    <!-- 2. 타임딜 타이머 -->
    <div class="timer-bar">
        <div>토스 타임딜 <span id="countdown">00:00:00</span></div>
        <a href="https://toss.im" class="timer-btn" target="_blank">특가 보러가기 ↗</a>
    </div>

    <!-- 3. 검색창 -->
    <div class="search-container">
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 상품명이나 단어 일부로 검색">
    </div>

    <!-- 4. 카테고리 탭 -->
    <div class="tabs" id="categoryTabs">
        <button class="tab-btn active" data-category="전체">전체</button>
        <button class="tab-btn" data-category="토스">토스</button>
        <button class="tab-btn" data-category="쿠팡">쿠팡</button>
    </div>

    <!-- 5. 상품이 표시될 공간 (JS가 여기에 상품을 그려넣습니다) -->
    <div class="product-grid" id="productGrid">
        <div id="empty-msg">검색 결과가 없습니다.</div>
    </div>

</div>

<!-- ========================================== -->
<!-- 👇 매일 여기부터 수정하세요 (상품 데이터 관리) 👇 -->
<!-- ========================================== -->
<script>
    const products = [
        {
            name: "이롬 국내산 약콩 무가당 두유 190ml 16개",
            platform: "토스",            // 탭 분류용 (토스 또는 쿠팡)
            price: "9,900",              // 실제 판매가
            discount: "35",              // 할인율 숫자만 (없으면 비워두기 "")
            badgeText: "기록상 최저가",  // 배지 글자 (없으면 비워두기 "")
            isSoldOut: false,            // 품절이면 true 로 변경
            image: "https://via.placeholder.com/300/f5f5f5/888?text=상품이미지1",
            link: "https://toss.im"      // 본인 수익 링크
        },
        {
            name: "예진원 국내산 ABC주스 80ml 35개",
            platform: "토스",
            price: "15,500",
            discount: "50",
            badgeText: "기록상 최저가",
            isSoldOut: false,
            image: "https://via.placeholder.com/300/f5f5f5/888?text=상품이미지2",
            link: "https://toss.im"
        },
        {
            name: "스파클 생수 무라벨 2L 24개",
            platform: "쿠팡",
            price: "7,400",
            discount: "63",
            badgeText: "로켓배송",
            isSoldOut: false,
            image: "https://via.placeholder.com/300/f5f5f5/888?text=상품이미지3",
            link: "https://coupang.com"
        },
        {
            name: "슬림떡볶이 로제맛 230g 4개",
            platform: "토스",
            price: "11,200",
            discount: "20",
            badgeText: "",
            isSoldOut: true,            // 품절 처리 예시
            image: "https://via.placeholder.com/300/f5f5f5/888?text=상품이미지4",
            link: "https://toss.im"
        }
    ];

    // ==========================================
    // 💡 아래부터는 건드리지 마세요! (자동 렌더링 로직)
    // ==========================================

    const grid = document.getElementById('productGrid');
    const emptyMsg = document.getElementById('empty-msg');
    let currentCategory = '전체';
    let currentSearch = '';

    // 화면에 상품 카드를 그리는 함수
    function renderProducts() {
        // 기존 내용 지우기
        const cards = grid.querySelectorAll('.card');
        cards.forEach(card => card.remove());

        // 필터링 적용 (탭 + 검색어)
        const filtered = products.filter(p => {
            const matchCategory = currentCategory === '전체' || p.platform === currentCategory;
            const matchSearch = p.name.replace(/\s+/g, '').includes(currentSearch.replace(/\s+/g, ''));
            return matchCategory && matchSearch;
        });

        // 결과 없음 처리
        emptyMsg.style.display = filtered.length === 0 ? 'block' : 'none';

        // 필터링된 상품 추가
        filtered.forEach(p => {
            const card = document.createElement('a');
            card.href = p.link;
            card.target = '_blank';
            card.className = `card ${p.isSoldOut ? 'sold-out' : ''}`;

            // 배지 HTML 생성
            let badgesHtml = '';
            if(p.badgeText) badgesHtml += `<span class="badge badge-low">${p.badgeText}</span>`;
            if(p.isSoldOut) badgesHtml += `<span class="badge badge-soldout">품절</span>`;

            // 할인율 HTML 생성
            let discountHtml = p.discount ? `<span class="p-discount">${p.discount}%</span>` : '';

            card.innerHTML = `
                <div class="img-box">
                    <img src="${p.image}" alt="${p.name}">
                    <div class="badge-container">${badgesHtml}</div>
                </div>
                <div class="info">
                    <span class="platform-tag">${p.platform}</span>
                    <div class="p-name">${p.name}</div>
                    <div class="price-row">
                        ${discountHtml}
                        <span class="p-price">${p.price}원</span>
                    </div>
                    <button class="btn-buy" ${p.isSoldOut ? 'disabled' : ''}>
                        ${p.platform}에서 확인 ➔
                    </button>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    // 탭 클릭 이벤트 설정
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            currentCategory = e.target.getAttribute('data-category');
            renderProducts();
        });
    });

    // 검색어 입력 이벤트 설정 (실시간 필터링)
    document.getElementById('searchInput').addEventListener('input', (e) => {
        currentSearch = e.target.value;
        renderProducts();
    });

    // 카운트다운 타이머 로직 (매일 자정 기준 리셋)
    function updateTimer() {
        const now = new Date();
        const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
        const diff = tomorrow - now;

        const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
        const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
        const s = Math.floor((diff % (1000 * 60)) / 1000).toString().padStart(2, '0');

        document.getElementById('countdown').innerText = `${h}:${m}:${s}`;
    }
    
    // 초기 실행
    setInterval(updateTimer, 1000);
    updateTimer();
    renderProducts();

</script>
</body>
</html>
